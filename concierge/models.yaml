# The tested model list for Noir's own brain.
#
# Noir is the always-on concierge, so its model must be small enough to stay
# loaded without slowing the computer down or crowding out the bigger model an
# agent will use later. The picker in catalog.py takes the FIRST entry below
# that fits the machine, so keep the list ordered best first.
#
# Fields:
#   tag          Ollama model tag (ollama pull <tag>).
#   name         What the user sees.
#   download_gb  Size of the download, from the Ollama registry manifest.
#   memory_gb    Memory the loaded model really uses with num_ctx 4096.
#   measured     true when memory_gb was measured on a real card with
#                `python -m concierge measure <tag>`, false while it is an
#                estimate. Do not trust Ollama's own number: it reported
#                1.45 GB for gemma4:12b while the card used 9.7 GB.
#   languages    Languages it handles well enough to talk with people.
#   notes        Why it is on the list, and what it is bad at.

models:
  - tag: qwen3.5:4b
    name: Qwen 3.5 4B
    download_gb: 3.32
    memory_gb: 3.8  # RTX 5080, 2026-10-28; Ollama claimed 2.92
    measured: true
    languages: [en, ko, ja, zh]
    notes: >-
      Newest small Qwen. Its 9B sibling beat qwen3:8b on everyday
      conversation in the first comparison round (80% vs 56% wants met).

  - tag: qwen3:4b
    name: Qwen 3 4B
    download_gb: 2.5
    memory_gb: 3.4
    measured: false
    languages: [en, ko, ja, zh]
    notes: Proven older generation; fallback when qwen3.5:4b does not fit.

  - tag: qwen3:1.7b
    name: Qwen 3 1.7B
    download_gb: 1.36
    memory_gb: 2.1
    measured: false
    languages: [en, ko, ja, zh]
    notes: For 8 GB graphics cards and 16 GB laptops. Short answers only.

  - tag: gemma3:1b
    name: Gemma 3 1B
    download_gb: 0.81
    memory_gb: 1.3
    measured: false
    languages: [en, ko, ja]
    notes: Smallest model that still holds a sensible conversation.

  - tag: qwen3:0.6b
    name: Qwen 3 0.6B
    download_gb: 0.52
    memory_gb: 1.1
    measured: false
    languages: [en]
    notes: Last resort for very small machines. Often confused; tell the user.

# Bigger models for agent jobs Noir's own model is too small for. They load
# only while such an agent works, next to Noir, so they must fit in what
# its model leaves free (see catalog.helper_room). Best first within a role.
#
#   role   general (bigger all-round model), vision (understands images),
#          speech (speech to text; runs with faster-whisper, not Ollama)

helpers:
  - tag: qwen3.5:9b
    name: Qwen 3.5 9B
    role: general
    download_gb: 6.6
    memory_gb: 7.2
    measured: true
    languages: [en, ko, ja, zh]
    notes: Best everyday results in the first comparison round (80% wants met).

  - tag: qwen3:8b
    name: Qwen 3 8B
    role: general
    download_gb: 5.2
    memory_gb: 6.6
    measured: true
    languages: [en, ko, ja, zh]
    notes: The model from before; fallback when Qwen 3.5 9B does not fit.

  - tag: qwen3-vl:8b
    name: Qwen 3 VL 8B
    role: vision
    download_gb: 6.1
    memory_gb: 7.5
    measured: false
    languages: [en, ko, ja, zh]
    notes: Reads text in screenshots and describes images.

  - tag: whisper-small
    name: Whisper Small
    role: speech
    download_gb: 0.5
    memory_gb: 1.0
    measured: false
    languages: [en, ko, ja, zh]
    notes: Speech to text. Runs on the processor too, a little slower than real time.

# Local models that may talk an agent's setup through with the user (agents/conductor.py):
# the conductor reads the conversation and fills a form each turn, and code checks it.
# Only models that passed `python -m concierge.conductor_eval <tag>` belong here, best
# first. Size doesn't qualify one: on the same setup qwen3.5:9b switched the agent on with
# no yes, and qwen3.6:35b-a3b wanted to move bank statements. One is used only when it is
# installed and fits beside Noir's own model (catalog.helper_room); otherwise the plain
# questions are asked. Same fields as above.

conductors:
  - tag: gemma4:12b
    name: Gemma 4 12B
    download_gb: 8.0
    memory_gb: 9.7  # RTX 5080; Ollama claimed 1.45
    measured: true
    languages: [en, ko]
    notes: >-
      Passed conductor_eval on 10 Nov 2026, 50 of 50 three runs in a row; one of its
      seven setups is in Korean, the rest in English.
