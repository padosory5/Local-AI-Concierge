# The one template every card is saved under. It is not a kind of agent: an agent is a
# card (when it works, what it looks at, the rule, what it does then), worked out in a
# conversation, and everything a card can be made of is in agents/parts.py, with what
# each part is shown and run as.
#
# What is here is only what the plain way needs, on a computer where no model can hold
# that conversation (agents/builder.py): the settings of a card that works on text, to
# show and change one by one, and the building blocks (capabilities.yaml) a card can be
# made of, so the idea planner knows an idea made only of these can be made.
#
#   generic   true: never offered by the router as a kind of agent.

id: custom
name: Made from parts
generic: true
pitch: ""
when: ""
examples: []
blocks: [on_request, while_on, selected_text, new_file, folder_files, translate, rewrite, summarize, extract, classify,
         move_files, show_popup, copy_clipboard, save_file]
slots:
  instruction:
    label: What it does
    type: instruction
    ask: null
    changeable: true
  when:
    label: When it works
    type: choice
    ask: null
    choices: [While it's switched on, When you ask in the chat]
    default: While it's switched on
    changeable: true
  show:
    label: How it shows the result
    type: choice
    ask: null
    choices: [A bubble above the text, Copy it to the clipboard, Both]
    default: A bubble above the text
    changeable: true
  keep:
    label: How long the result stays
    type: choice
    ask: null
    choices: [Until you unhighlight the text, A few seconds]
    default: Until you unhighlight the text
    changeable: true
  name:
    label: Name
    type: text
    ask: null
    changeable: true
