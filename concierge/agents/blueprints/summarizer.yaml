# The summary writer: the second kind of watched-folder agent, run by the same machine as
# the file organizer (concierge/organizer.py). It watches a folder and, when a document
# lands, writes a few lines about it into a notes file, so the user can skim what arrived
# without opening everything. Nothing is moved.
#
#   watches     true: the folder is watched for new files, not read for answers.

id: summarizer
name: Summary writer
pitch: >-
  It watches a folder and writes a few lines about each new document into a notes
  file, so you can skim what arrived without opening everything.
when: >-
  The user wants new files that land in a folder summed up, summarized, briefed or
  noted as they arrive, or a running notes file of what came in.
examples:
  - when a pdf lands in my downloads, write me a short summary in a notes file
  - sum up every document that arrives in Downloads
  - keep notes on what I download
  - 다운로드되는 문서마다 짧게 요약해서 적어줘
blocks: [new_file, folder_files, summarize, save_file]
switchable: true
watches: true
default_name: Summary writer
slots:
  folder:
    label: Watches
    type: folder
    ask: Which folder should it watch? Downloads is where most things land.
    changeable: true
  notes:
    label: Keeps the summaries in
    type: text
    ask: Where should the summaries go? A notes file in that folder is simplest, or name a file.
    choices: [A Summaries.md file in that folder]
    changeable: true
  length:
    label: How much it writes
    type: choice
    ask: null
    choices: [Three short lines, One short paragraph]
    default: Three short lines
    changeable: true
  name:
    label: Name
    type: text
    ask: null
    changeable: true
can_do: []  # written in code from the slots, see summarizer_card
cannot_do:
  - Change or move the files it reads
  - Send anything over the internet
can_change_files: false
