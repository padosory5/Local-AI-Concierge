# The file organizer: the first chore Noir builds for people. It watches a folder and
# puts each new document into a folder by what the document is about (or by its
# name), and every move can be undone. The questions are the discussion: how to tell
# files apart, and which folders. What each file is about is decided by the built-in
# model from the file's first pages, on this computer (concierge/organizer.py).
#
#   watches     true: the folder is watched for new files, not read for answers,
#               so the setup doesn't need readable files in it and doesn't test-drive.

id: organizer
name: File organizer
pitch: >-
  It watches a folder and puts each new document into a folder by what the document
  is about, and every move can be undone.
when: >-
  The user wants files sorted, organized, filed or tidied into folders by subject,
  course, topic or what they are about, as they arrive or all at once.
examples:
  - organize my school files into folders by course as I download them
  - sort the PDFs in my Downloads into folders by subject
  - when I download a physics pdf put it in a physics folder
  - file my documents by what they're about, the names don't say
  - keep my downloads organized by topic
  - 다운로드 폴더에 있는 파일들을 과목별로 정리해줘
blocks: [new_file, on_request, folder_files, classify, move_files]
switchable: true
watches: true
default_name: File organizer
# How it works, for the model that talks the setup through (agents/conductor.py): it
# may tell the user these and must promise nothing else, so each line has to stay true to
# concierge/organizer.py. A blueprint with facts is one that can be talked through.
facts:
  - >-
    It only touches files that land in the watched folder after it is switched on. The
    files already there stay where they are; right after it is created, the person is
    asked with two buttons whether to go through those too, and nothing moves unless
    they say yes.
  - >-
    It reads the first pages of each new file on this computer, with the small built-in
    model. Nothing leaves the computer.
  - >-
    With folders the person names, it only moves what clearly reads as material for
    one of them: course notes, homework, labs, slides, code for a class. A bill, a bank
    statement, a form, a receipt, a CV or anything it is unsure about stays where it
    is, even when it mentions a course or a school.
  - >-
    With "Decide as you go" it names a folder for each file by what the file is about
    and reuses those folders, so every kind of document gets filed, bank statements
    and CVs too; only a file it can't make out stays.
  - >-
    Material for a course none of the folders is, and a kind of file it has not sorted
    before (a spreadsheet, a picture), it asks about once and then remembers the
    answer.
  - >-
    It never deletes or changes a file. Every move shows in the chores list, with Undo
    for a week.
  - It works while the Noir app is open, minimized or not.
slots:
  folder:
    label: Watches
    type: folder
    ask: Which folder should it watch? Downloads is where most things land.
    changeable: true
  into:
    label: Puts the folders in
    type: text
    ask: Where should the sorted folders go? Inside that folder is simplest, or name a place.
    choices: [Inside that folder]
    changeable: true
  by:
    label: Tells files apart by
    type: choice
    ask: >-
      How should it tell what a file is? By what's inside, I read each file's first pages
      on this computer; by name is quicker, but only as good as the names.
    choices: [What's inside each file, The file's name]
    default: What's inside each file
    changeable: true
  groups:
    label: Folders
    type: text
    ask: >-
      What should the folders be called? Name them, or say decide as you go and I'll
      name folders by what I find.
    choices: [Decide as you go]
    changeable: true
  name:
    label: Name
    type: text
    ask: null
    changeable: true
can_do: []  # written in code from the slots, see organizer_card
cannot_do:
  - Delete or change a file
  - Move a kind of file you said no to
  - Read anything outside that folder, or use the internet
can_change_files: true
