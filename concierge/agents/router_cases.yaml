# Labelled messages for scoring the router against the real model:
#     python -m concierge.agents.eval_router
# The "agents" list is the user's existing agents during the test.

agents:
  - name: Contracts helper
    blueprint: documents_qa
    slots: {folder: C:/Users/test/Desktop/Contracts}
  - name: Korean translator
    blueprint: custom
    slots: {instruction: Translate the text into Korean., when: "While it's switched on", show: A bubble above the text, keep: A few seconds}

cases:
  # chat
  - {text: "hi Noir", kind: chat}
  - {text: "how are you today?", kind: chat}
  - {text: "what's the capital of Australia?", kind: chat}
  - {text: "rewrite this to sound friendlier: send me the report by friday", kind: chat}
  - {text: "what should I cook tonight", kind: chat}
  - {text: "explain what RAM is in one sentence", kind: chat}
  - {text: "thanks, that helped", kind: chat}
  - {text: "what graphics card do I have?", kind: chat}
  - {text: "can you book me a flight to Tokyo?", kind: chat}
  - {text: "write a short poem about rain", kind: chat}
  - {text: "오늘 날씨 어때?", kind: chat}
  - {text: "translate 'good morning' into Korean", kind: run_agent, agent: Korean translator}  # exactly its job
  # new agent
  - {text: "I want to ask questions about my lecture notes", kind: new_agent, blueprint: documents_qa}
  - {text: "can you search through my research papers folder?", kind: new_agent, blueprint: documents_qa}
  - {text: "make me an agent that reads my recipes folder", kind: new_agent, blueprint: documents_qa}
  - {text: "I have a bunch of manuals in Downloads, help me look things up in them", kind: new_agent, blueprint: documents_qa}
  - {text: "set up something that answers questions about my tax documents", kind: new_agent, blueprint: documents_qa}
  - {text: "can you read the PDFs in my Documents folder and answer questions?", kind: new_agent, blueprint: documents_qa}
  - {text: "I want a helper for my meeting notes so I can find what we decided", kind: new_agent, blueprint: documents_qa}
  - {text: "내 강의 노트 폴더에 대해 질문할 수 있게 해줘", kind: new_agent, blueprint: documents_qa}
  # run agent
  - {text: "ask Contracts helper who signed the Acme deal", kind: run_agent, agent: Contracts helper}
  - {text: "Contracts helper: when does the lease end?", kind: run_agent, agent: Contracts helper}
  - {text: "what are the payment terms in my contracts?", kind: run_agent, agent: Contracts helper}
  - {text: "check my contracts for the termination notice period", kind: run_agent, agent: Contracts helper}
  - {text: "which of my contracts mention a penalty fee?", kind: run_agent, agent: Contracts helper}
  # idea for another kind of helper
  - {text: "can you make something that translates text when I highlight it?", kind: idea}
  - {text: "I want an agent that copies my screenshots automatically", kind: idea}
  - {text: "make a helper that sorts my Downloads folder by file type", kind: idea}
  - {text: "set up a reminder to stretch every hour", kind: idea}
  - {text: "could you build an agent that books flights for me?", kind: idea}
  - {text: "make Ctrl+Shift+D type today's date for me", kind: idea}
  # helpers made from parts (the idea planner builds them)
  - {text: "make an agent that translates whatever I highlight into Korean", kind: idea}
  - {text: "when I select text in my browser, show me the translation", kind: idea}
  - {text: "하이라이트한 문장을 자동으로 번역해주는 에이전트 만들어줘", kind: idea}
  - {text: "translate 'thank you very much' into Japanese", kind: chat}
  # changing an agent the user already has (the model's part; code catches most first)
  - {text: "can you make the translation stay on until I unhighlight it", kind: change_agent, agent: Korean translator}
  - {text: "I want the Korean translator to copy to the clipboard instead", kind: change_agent, agent: Korean translator}
  - {text: "rename Contracts helper to Lease papers", kind: change_agent, agent: Contracts helper}
  - {text: "Korean translator: see you tomorrow", kind: run_agent, agent: Korean translator}
  - {text: "make an agent that explains difficult English words I highlight in simple Korean", kind: idea}
  - {text: "I want something that fixes the grammar of sentences I paste here", kind: idea}
