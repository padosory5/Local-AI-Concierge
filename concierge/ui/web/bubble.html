<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elaina</title>
  <style>
    /* Python cuts this window to a circle, and to a rounded card while the
       right-click menu is open (see _shape in window.py). For the menu it
       grows the window away from the circle and tells this page which way
       it grew, so the circle stays exactly where it was. */
    :root {
      --size: 52px; /* BUBBLE_SIZE in window.py */
      --accent: #6b57d1;
      --accent-light: #8f7ff0;
      --menu-bg: #ffffff;
      --menu-text: #1f1f1d;
      --menu-hover: #ece8fb;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --menu-bg: #2a2a2d;
        --menu-text: #ececea;
        --menu-hover: #3a3550;
      }
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--accent);
      user-select: none;
    }

    body.menu-open {
      background: var(--menu-bg);
    }

    /* The circle sits in the corner the window grows away from. */
    .circle {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent-light), var(--accent));
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .circle:hover,
    body.menu-open .circle {
      filter: brightness(1.12);
    }

    body.left .circle {
      left: auto;
      right: 0;
    }

    body.up .circle {
      top: auto;
      bottom: 0;
    }

    .menu {
      position: absolute;
      top: 50%;
      left: calc(var(--size) + 4px);
      right: 8px;
      display: none;
      transform: translateY(-50%);
    }

    body.menu-open .menu {
      display: block;
    }

    body.left .menu {
      left: 8px;
      right: calc(var(--size) + 4px);
    }

    .menu button {
      display: block;
      width: 100%;
      padding: 7px 12px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--menu-text);
      font: inherit;
      font-size: 14px;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }

    .menu button:hover {
      background: var(--menu-hover);
    }
  </style>
</head>
<body>
  <div class="menu" role="menu">
    <button id="open-app" type="button" role="menuitem">Open app</button>
    <button id="quit" type="button" role="menuitem">Quit Elaina</button>
  </div>
  <!-- pywebview-drag-region: pywebview moves the window while this is dragged. -->
  <div id="circle" class="circle pywebview-drag-region" title="Elaina: click to chat, right-click for more">AC</div>

  <script>
    window.bubble = (() => {
      const circle = document.getElementById("circle");
      const api = () => window.pywebview && window.pywebview.api;
      let menuOpen = false;
      let down = null; // where a left press started, to tell a click from a drag

      // Called from Python with the way the window grew ("left down", ...),
      // or null once it is back to just the circle.
      function setMenu(grow) {
        menuOpen = Boolean(grow);
        document.body.className = grow ? `menu-open ${grow}` : "";
      }

      circle.addEventListener("mousedown", (e) => {
        if (e.button === 0) down = { x: e.screenX, y: e.screenY };
      });

      // A press that moved the circle was a drag: the panel follows it.
      // One that did not was a click: it opens or closes the chat.
      window.addEventListener("mouseup", (e) => {
        if (e.button !== 0 || !down || !api()) return;
        const moved = Math.hypot(e.screenX - down.x, e.screenY - down.y) > 4;
        down = null;
        if (moved) api().moved();
        else if (menuOpen) api().menu(false);
        else api().toggle_panel();
      });

      document.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (api()) api().menu(!menuOpen);
      });

      // Clicking anywhere else closes the menu.
      window.addEventListener("blur", () => {
        if (menuOpen && api()) api().menu(false);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && menuOpen && api()) api().menu(false);
      });

      document.getElementById("open-app").addEventListener("click", () => api() && api().open_app());
      document.getElementById("quit").addEventListener("click", () => api() && api().quit());

      return { setMenu };
    })();
  </script>
</body>
</html>
