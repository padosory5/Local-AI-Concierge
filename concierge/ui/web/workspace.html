<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elaina</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<!-- The full app: a workspace for finding, adding and running agents. The chat
     is a dock beside the screens. Its ids are the ones app.js draws into, the
     same as the compact panel (panel.html), so both show one conversation. -->
<body class="workspace">
  <nav class="rail" aria-label="Main">
    <div class="brand rail-brand">
      <div class="avatar" aria-hidden="true">E</div>
      <div>
        <div class="brand-name">Elaina</div>
        <div class="brand-sub">Your AI workspace</div>
      </div>
    </div>
    <button id="add-agent" class="button accent rail-add" type="button"></button>
    <div id="nav" class="nav"></div>
    <div id="nav-advanced" class="nav nav-advanced"></div>
    <div class="rail-foot">
      <span class="status-dot" aria-hidden="true"></span>
      <div id="model-line" class="rail-status">Checking your computer...</div>
    </div>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>

  <aside id="dock" class="dock" aria-label="Chat with Elaina">
    <div class="dock-inner">
      <header class="dock-header">
        <div class="avatar" aria-hidden="true">E</div>
        <div class="dock-title">Elaina</div>
        <button id="new-chat" class="icon-button" type="button" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        </button>
        <span id="dock-tools" class="dock-tools"></span>
      </header>
      <div id="history" class="dock-history" hidden>
        <ul id="chats" class="chats"><li class="muted">No chats yet</li></ul>
      </div>

      <section id="messages" class="messages" aria-live="polite">
        <div id="empty" class="empty">
          <p class="empty-title">Ask me anything</p>
          <p>Try "turn on the Highlight Explainer". Everything stays on this computer.</p>
        </div>
      </section>

      <div id="progress" class="progress" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="progress-text"></span>
      </div>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message Elaina" aria-label="Message Elaina"></textarea>
        <button id="think" class="think-toggle" type="button" aria-pressed="false"
                title="Elaina shows her full thinking before answering. Much slower (about 20 seconds).">Think</button>
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </div>
  </aside>

  <button id="dock-open" class="dock-open" type="button">
    <span class="avatar" aria-hidden="true">E</span>Ask Elaina
  </button>

  <dialog id="add-dialog" class="sheet" aria-label="Add an agent"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Screens load first: app.js may start drawing the moment it runs. -->
  <script src="workspace/mock.js"></script>
  <script src="workspace/parts.js"></script>
  <script src="workspace/store.js"></script>
  <script src="workspace/activity.js"></script>
  <script src="workspace/home.js"></script>
  <script src="workspace/discover.js"></script>
  <script src="workspace/library.js"></script>
  <script src="workspace/studio.js"></script>
  <script src="workspace/add_agent.js"></script>
  <script src="workspace/main.js"></script>
  <script src="app.js"></script>
</body>
</html>
