<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elaina</title>
  <link rel="stylesheet" href="glass.css">
</head>
<!-- The card that grows out of minimized Elaina. Quiet, it's just what she's doing
     and anything she needs answered. Once the user talks, it becomes a small chat
     that reads downward to the box, the same conversation as the full window. -->
<body>
  <section id="card">
    <header>
      <canvas id="mark" width="72" height="72" aria-hidden="true"></canvas>
      <div class="who">
        <div class="title">Elaina</div>
        <div id="summary" class="summary"></div>
      </div>
      <button id="open" type="button" title="Open the full window" aria-label="Open the full window">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10v10M19 5 6 18"/></svg>
      </button>
      <button id="hide" type="button" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div id="status"></div>
    <main id="thread" aria-live="polite"></main>
    <form id="ask" autocomplete="off">
      <input id="text" placeholder="Ask Elaina" aria-label="Ask Elaina">
      <button id="send" type="submit" aria-label="Send" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v8H6M10 8.5 5.5 13l4.5 4.5"/></svg>
      </button>
    </form>
  </section>
  <script src="glass.js"></script>
</body>
</html>
