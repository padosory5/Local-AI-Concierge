<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elaina</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="today.css">
</head>
<!-- The full window. It opens on "Help me": a rolling list of what the user can
     make an agent for, with one line to write on. Picking one turns this into a
     normal chat. Its ids are the ones app.js draws into. -->
<body class="quiet" data-view="help">
  <nav class="side" aria-label="Main">
    <div class="side-brand">
      <canvas id="mark" width="52" height="52" aria-hidden="true"></canvas>
      Elaina
    </div>
    <button id="start" class="new-chat" type="button" data-icon="plus">New chat</button>
    <button class="side-item" type="button" data-view="today" data-icon="today">
      Today<span id="today-count" class="count" hidden></span>
    </button>

    <div class="side-label">Sessions</div>
    <ul id="chats" class="chats"><li class="muted">No sessions yet</li></ul>

    <div class="side-label">Agents</div>
    <div id="helpers" class="helpers"></div>
    <div id="suggested-label" class="side-label quiet-label" hidden>Add more</div>
    <div id="suggested" class="helpers"></div>

    <div class="side-foot">
      <button class="side-item" type="button" data-view="settings" data-icon="gear">Settings</button>
      <div id="side-model" class="side-model"></div>
    </div>
  </nav>

  <main class="stage">
    <canvas id="corner" width="1040" height="680" aria-hidden="true"></canvas>
    <button id="working" class="working" type="button" hidden></button>

    <div class="views">
      <section id="view-help" class="view help" aria-label="What should we make?">
        <div class="help-row">
          <div class="help-lead">Help me</div>
          <div id="wheel" class="wheel" role="listbox" aria-label="What you can make an agent for"></div>
        </div>
      </section>

      <section id="view-chat" class="view chat-view" aria-label="Chat with Elaina" hidden>
        <button id="new-chat" type="button" hidden>New chat</button>
        <div id="messages" class="messages" aria-live="polite">
          <div id="empty" class="empty" hidden></div>
        </div>
        <div id="progress" class="progress" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="progress-text"></span>
        </div>
      </section>

      <section id="view-today" class="view" aria-label="Today" hidden></section>
      <section id="view-helper" class="view agent-page" aria-label="Agent" hidden></section>

      <section id="view-settings" class="view" aria-label="Settings" hidden>
        <h1>Settings</h1>
        <p class="sub">Everything stays on this computer.</p>
        <h2>Elaina</h2>
        <div id="model-line" class="plain">Checking your computer...</div>
        <h2>This computer</h2>
        <ul id="hardware" class="plain-list"></ul>
        <div class="actions"><button id="quit" class="line-button" type="button">Quit Elaina</button></div>
      </section>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="or just tell me in your own words" aria-label="Message Elaina"></textarea>
      <button id="think" class="think-toggle" type="button" aria-pressed="false"
              title="Elaina shows her full thinking before answering. Much slower (about 20 seconds).">Think</button>
      <button id="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v8H6M10 8.5 5.5 13l4.5 4.5"/></svg>
      </button>
    </form>
  </main>

  <!-- today.js first: app.js may start drawing the moment it runs. -->
  <script src="today.js"></script>
  <script src="app.js"></script>
</body>
</html>
