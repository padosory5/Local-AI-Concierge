# Where a page comes from, for the research job's picker (concierge/sources.py).
# It promotes, never bans: an unknown site still gets read when nothing better
# answers, and a site listed as a content farm is only read last. A "*." prefix
# matches the domain and everything under it. Edit freely; the order inside a
# tier doesn't matter.
tiers:
  # The thing itself, a government, a university, a standards body, a paper.
  primary:
    - "*.gov"
    - "*.go.kr"
    - "*.edu"
    - "*.ac.kr"
    - "*.ac.uk"
    - "*.gov.uk"
    - "*.europa.eu"
    - "*.who.int"
    - "*.un.org"
    - "*.nobelprize.org"
    - "*.python.org"
    - "*.github.com"
    - "*.arxiv.org"
    - "*.ietf.org"
    - "*.w3.org"
    - "*.mozilla.org"
    - "*.microsoft.com"
    - "*.apple.com"
    - "*.google.com"
    - "*.samsung.com"
    - "*.openai.com"
    - "*.anthropic.com"
    - "*.nousresearch.com"
    - "*.ollama.com"
    - "*.stlouisfed.org"
    - "*.ecb.europa.eu"
    - "*.bok.or.kr"
    - "*.kostat.go.kr"
  # Encyclopaedias, major news, medical and scientific references.
  reference:
    - "*.wikipedia.org"
    - "*.britannica.com"
    - "*.reuters.com"
    - "*.apnews.com"
    - "*.bbc.com"
    - "*.bbc.co.uk"
    - "*.nytimes.com"
    - "*.washingtonpost.com"
    - "*.theguardian.com"
    - "*.ft.com"
    - "*.bloomberg.com"
    - "*.economist.com"
    - "*.wsj.com"
    - "*.nature.com"
    - "*.science.org"
    - "*.scientificamerican.com"
    - "*.nih.gov"
    - "*.mayoclinic.org"
    - "*.clevelandclinic.org"
    - "*.nhs.uk"
    - "*.yna.co.kr"
    - "*.yonhapnews.co.kr"
    - "*.koreaherald.com"
    - "*.koreatimes.co.kr"
    - "*.hani.co.kr"
    - "*.joongang.co.kr"
    - "*.chosun.com"
    - "*.seattletimes.com"
    - "*.latimes.com"
    - "*.theverge.com"
    - "*.arstechnica.com"
    - "*.wired.com"
    - "*.techcrunch.com"
    - "*.stackoverflow.com"
    # Journals and medical bodies.
    - "*.nejm.org"
    - "*.thelancet.com"
    - "*.bmj.com"
    - "*.jamanetwork.com"
    - "*.cochranelibrary.com"
    - "*.sciencedirect.com"
    - "*.springer.com"
    - "*.wiley.com"
    - "*.tandfonline.com"
    - "*.frontiersin.org"
    - "*.plos.org"
    - "*.aap.org"
    - "*.healthychildren.org"
    - "*.webmd.com"
    - "*.healthline.com"
    # Housing and market data with their own numbers.
    - "*.redfin.com"
    - "*.zillow.com"
    - "*.realtor.com"
    - "*.nwmls.com"
  # Pages written for search engines rather than readers. Read last, never first.
  farm:
    - "*.pages.dev"
    - "*.vercel.app"
    - "*.netlify.app"
    - "*.blogspot.com"
    - "*.weebly.com"
    - "*.wixsite.com"
    - "*.pinterest.com"
    - "*.quora.com"
    - "*.answers.com"
    - "*.tilnote.io"
