# Builds Noir for Windows and the Mac and attaches both to a GitHub release.
# Runs when a version tag is pushed (git tag v0.2.0 && git push --tags), or by hand
# from the Actions tab, which only uploads the files as artifacts.
#
# Both builds are unsigned for now: Windows shows "Windows protected your PC" (More
# info, then Run anyway) and the Mac needs a right-click and Open the first time. A
# signing certificate and Apple notarization would remove those; see README.md.

name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest # Apple Silicon
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: noir-${{ matrix.name }}
          path: |
            dist/Noir-*
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Noir-*
